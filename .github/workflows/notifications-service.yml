name: Platform production security

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject broken self-symlinks
        run: |
          if [ -L nexastays_platform ] || [ -L nexastays_platform/nexastays_platform ]; then
            echo "Broken self-symlink present" >&2
            exit 1
          fi

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [event-bus, telemetry, identity-read-model, consumers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build event-bus (dependency)
        if: matrix.package != 'event-bus' && matrix.package != 'telemetry'
        working-directory: event-bus
        run: npm ci && npm run build
      - name: Build telemetry (dependency)
        if: matrix.package == 'consumers' || matrix.package == 'identity-read-model'
        working-directory: telemetry
        run: npm ci && npm run build
      - name: Build identity read model (consumer dependency)
        if: matrix.package == 'consumers'
        working-directory: identity-read-model
        run: npm ci && npm run build
      - name: Install + build package
        working-directory: ${{ matrix.package }}
        run: |
          npm ci
          npm run build
          npm test --if-present

  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notifications-service, media-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Build event-bus
        working-directory: event-bus
        run: npm ci && npm run build
      - name: Build telemetry
        working-directory: telemetry
        run: npm ci && npm run build
      - name: Install service
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Audit production dependencies
        working-directory: ${{ matrix.service }}
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build
      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
